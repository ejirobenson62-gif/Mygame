<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naija Would You Rather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🇳🇬 Naija Would You Rather 🇳🇬</h1>
        <div class="stats">
            <p>Score: <span id="score">0</span></p>
            <p>Lives: <span id="lives">3</span></p>
            <p>Time: <span id="timer">10</span>s</p>
        </div>
        <div class="question-box">
            <p id="qNum">Question 1</p>
            <h2 id="question">Loading...</h2>
            <button id="optA"></button>
            <button id="optB"></button>
            <p id="roast"></p>
            <p id="result"></p>
            <button id="nextBtn" style="display:none;">Next Question</button>
            <button id="restartBtn" style="display:none;">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
                        </html>
